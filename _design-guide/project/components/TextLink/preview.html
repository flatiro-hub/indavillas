<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextLink</title>
<style>html,body{margin:0;background:var(--limewash)}</style>
</head>
<body>
<div class="iv-root">
<p style="margin:0;padding:24px;max-width:60ch">Not sure which plan fits? <a class="iv-link" href="#pricing">See how Growth and Excellence differ</a>, or read <a class="iv-link" href="#system">the three phases of the system</a>.</p>
</div>
<script>
  /* Swap the logo file to the brass mark when the frame is in the dark theme (an img cannot inherit colour). */
  (function () {
    function sync() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('img[data-mark]').forEach(function (i) { i.src = dark ? '/_blob/625d17c53bcc9e37516703a82b1471cb' : '/_blob/796235b20551ebe79bd8cb51e5d8b091'; });
    }
    sync();
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  })();
</script>
</body>
</html>
