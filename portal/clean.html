<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4F0E7">
<title>Jadwal bersih · IndaVillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --sand:#F4F0E7; --paper:#FCFAF5; --ink:#23261F; --ink-soft:#585B50; --ink-mute:#7D7D72;
  --teal:#13564F; --teal-dk:#0C3E38; --teal-tint:#DCE9E5; --teal-soft:#EDF3F1;
  --gold:#B98C3E; --gold-tint:#F6EEDD; --gold-ink:#7A5A22;
  --line:#E4DECF; --line-soft:#EFEADD; --alert:#A83E28; --alert-tint:#F7E6E1; --ok:#2F7A5C; --ok-tint:#E3F0E9;
  --ff-head:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --sh:0 2px 10px -4px rgba(35,38,31,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--ff-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
/* header */
.top{position:sticky;top:0;z-index:5;background:rgba(244,240,231,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line-soft)}
.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;color:var(--teal);flex:1;min-width:0}
.logo svg{width:26px;height:22px;flex:none}
.logo b{font-family:var(--ff-head);font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:2px}
.lang button{border:0;background:none;min-width:40px;min-height:34px;border-radius:999px;font-family:var(--ff-head);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);color:#fff}
/* title */
.head{padding:18px 0 6px}
.eyebrow{font-family:var(--ff-head);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin:0}
h1{font-family:var(--ff-head);font-weight:600;font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:4px 0 0;overflow-wrap:anywhere}
.date{color:var(--ink-soft);font-size:15px;margin:2px 0 0}
/* today */
.today{display:grid;gap:10px;margin:14px 0 4px}
.st{border-radius:var(--r);padding:14px 16px;background:var(--paper);border:1px solid var(--line-soft);box-shadow:var(--sh);display:grid;gap:4px;border-left:6px solid var(--line)}
.st .v{font-family:var(--ff-head);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute)}
.st b{font-family:var(--ff-head);font-weight:600;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.st p{margin:0;color:var(--ink-soft);font-size:15px}
.st.clean{border-left-color:var(--gold);background:var(--gold-tint)}
.st.urgent{border-left-color:var(--alert);background:var(--alert-tint)}
.st.guests{border-left-color:var(--teal);background:var(--teal-soft)}
.st.arrive{border-left-color:var(--ok);background:var(--ok-tint)}
/* tabs + villa chips */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin:18px 0 10px}
.tabs button{border:0;background:none;min-height:42px;border-radius:999px;font-family:var(--ff-head);font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--teal);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;min-height:38px;padding:0 14px;font-family:var(--ff-head);font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dk)}
/* list */
.mon{font-family:var(--ff-head);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mute);margin:18px 2px 8px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.ev .d{border-radius:10px;background:var(--sand);display:grid;place-content:center;text-align:center;padding:8px 0;align-self:start}
.ev .d small{display:block;font-family:var(--ff-head);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);line-height:1.2}
.ev .d b{display:block;font-family:var(--ff-head);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.ev.turn .d{background:var(--alert-tint)} .ev.turn .d b{color:var(--alert)}
.ev.out .d{background:var(--gold-tint)} .ev.out .d b{color:var(--gold-ink)}
.ev.in .d{background:var(--ok-tint)} .ev.in .d b{color:var(--ok)}
.ev.past{opacity:.55}
.ev h3{font-family:var(--ff-head);font-weight:600;font-size:16px;line-height:1.3;margin:2px 0 6px}
.ev .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.01em;background:var(--sand);color:var(--ink-soft)}
.tag.rel{background:var(--teal);color:#fff}
.tag.alert{background:var(--alert);color:#fff}
.tag.ok{background:var(--ok);color:#fff}
.tag.warn{background:var(--gold-tint);color:var(--gold-ink)}
.tag.villa{background:var(--teal-soft);color:var(--teal-dk)}
.ln{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink);margin:3px 0}
.ln svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink-mute)}
.ln.mute{color:var(--ink-soft)}
.ln b{font-weight:700}
.ln em{font-style:normal;color:var(--ink-mute);font-size:13px}
/* calendar */
.cal{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 10px 14px;box-shadow:var(--sh)}
.cnav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.cnav b{font-family:var(--ff-head);font-weight:600;font-size:17px;text-transform:capitalize}
.cnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:20px;line-height:1;cursor:pointer}
.cnav button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-family:var(--ff-head);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);padding:4px 0}
.dy{position:relative;width:100%;min-width:0;height:52px;border:0;border-radius:9px;background:none;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;font-family:var(--ff-head);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink)}
.dy.blank{cursor:default}
.dy.past{color:var(--ink-mute);opacity:.55}
.dy.occ{background:var(--teal-tint)}
.dy.ci{background:linear-gradient(135deg,transparent 0 50%,var(--teal-tint) 50% 100%)}
.dy.co{background:linear-gradient(135deg,var(--teal-tint) 0 50%,transparent 50% 100%)}
.dy.co.ci{background:linear-gradient(135deg,var(--teal-tint) 0 47%,var(--paper) 47% 53%,var(--teal-tint) 53% 100%)}
.dy.today{box-shadow:inset 0 0 0 2px var(--ink)}
.dy.sel{box-shadow:inset 0 0 0 2px var(--teal);}
.dy.today.sel{box-shadow:inset 0 0 0 3px var(--teal)}
.dy .mk{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--gold)}
.dy.co.ci .mk{background:var(--alert);width:11px;height:11px}
.dy.ci:not(.co) .mk{background:var(--ok)}
.dy.uc{background-image:repeating-linear-gradient(135deg,rgba(19,86,79,.10) 0 4px,transparent 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 4px 0;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--teal-tint)}
.legend i.dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.legend i.dot.r{background:var(--alert)} .legend i.dot.g{background:var(--ok)}
.dayinfo{margin-top:12px}
.dayinfo .none{color:var(--ink-soft);font-size:15px;margin:6px 4px}
/* misc */
.msg{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px 18px;margin-top:20px;box-shadow:var(--sh)}
.msg b{font-family:var(--ff-head);font-size:18px;font-weight:600;display:block;margin-bottom:4px}
.msg p{margin:0;color:var(--ink-soft)}
.note{background:var(--gold-tint);color:var(--gold-ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;color:var(--ink-mute);font-size:13.5px}
.btn{border:1px solid var(--teal);background:var(--paper);color:var(--teal);border-radius:999px;min-height:42px;padding:0 18px;font-family:var(--ff-head);font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{background:var(--teal);color:#fff}
.btn:disabled{opacity:.6}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--paper),#fff,var(--paper));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px;border:1px solid var(--line-soft)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (min-width:480px){h1{font-size:28px}.ev{grid-template-columns:70px 1fr;padding:14px}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <span class="logo" translate="no"><svg viewBox="0 0 296 244" fill="currentColor" aria-hidden="true"><polygon points="0,0 88,0 44,75"/><polygon points="88,24 88,150 51,88"/><polygon points="100,23 100,166 141,95"/><polygon points="142,117 142,244 106,179"/><polygon points="154,117 154,244 190,179"/><polygon points="196,23 196,166 155,95"/><polygon points="208,24 208,150 245,88"/><polygon points="296,0 208,0 252,75"/></svg><b>IndaVillas</b></span>
  <span class="lang" role="group" aria-label="Bahasa / Language" translate="no"><button type="button" data-lang="id" aria-pressed="true">ID</button><button type="button" data-lang="en" aria-pressed="false">EN</button></span>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
"use strict";
/* Cleaning calendar for cleaners. Opened from a secret link (clean.html?k=...) that admins make on the portal's Cleaners page.
   It shows check-outs, check-ins and how many guests: no names, contacts or prices. Data comes from Hostex through the
   portal's cleanCalendar function and refreshes every 10 minutes. ?demo=1 shows example data. */
const API = "https://asia-southeast1-indavillas-portal.cloudfunctions.net/cleanCalendar";
const Q = new URLSearchParams(location.search), KEY = Q.get("k") || "", DEMO = Q.get("demo") === "1";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const S = { data: null, err: "", stale: false, loading: true, busy: false, tab: "list", pid: "all", month: null, sel: null, lang: store.get("iv_clean_lang") || "" };

const T = {
  id: { title: "Jadwal bersih-bersih", today: "Hari ini", tomorrow: "Besok", inDays: n => `Dalam ${n} hari`, ago: n => n === 1 ? "Kemarin" : `${n} hari lalu`,
    list: "Jadwal", cal: "Kalender", all: "Semua vila",
    turn: "Bersihkan, tamu baru datang hari yang sama", out: "Bersihkan setelah tamu keluar", in: "Tamu datang: cek vila siap",
    sameDay: "Hari yang sama", leave: "Tamu keluar", arrive: "Tamu baru datang", arriveIn: "Tamu datang", next: "Tamu berikutnya", noNext: "Belum ada tamu berikutnya",
    window: "Waktu bersih", prep: "Siapkan untuk", guests: n => `${n} tamu`, adults: n => `${n} dewasa`, children: n => `${n} anak`, infants: n => `${n} bayi`, pets: n => `${n} hewan`, nights: n => `${n} malam`,
    emptySince: "Vila kosong sejak", ready: "Pastikan vila bersih dan siap sebelum tamu datang",
    notConfirmed: "Belum pasti", left: "Tamu sudah keluar · bisa mulai", inHouse: "Tamu masih di vila", fromGuest: "jam dari tamu",
    sClean: "Bersihkan hari ini", sUrgent: "Bersihkan hari ini · tamu baru datang", sGuests: "Ada tamu", sArrive: "Tamu datang hari ini", sEmpty: "Vila kosong",
    until: "sampai", nextGuests: "Tamu berikutnya", noGuests: "Belum ada tamu berikutnya", after: "setelah", before: "sebelum",
    nothing: "Tidak ada jadwal dalam 3 bulan ke depan.", updated: "Diperbarui", refresh: "Perbarui", loading: "Memuat jadwal…",
    badlink: "Link ini tidak berlaku lagi", badlinkP: "Minta link baru ke IndaVillas.", nolink: "Buka link dari IndaVillas", nolinkP: "Halaman ini hanya bisa dibuka dari link yang dikirim IndaVillas.",
    neterr: "Tidak bisa memuat jadwal", neterrP: "Cek internet, lalu tekan Perbarui.", stale: "Tidak bisa memperbarui. Ini jadwal terakhir dari",
    legGuests: "Ada tamu", legClean: "Hari bersih", legSame: "Tamu baru hari yang sama", legIn: "Tamu datang", noEvents: "Tidak ada tamu keluar atau datang.",
    stay: "Ada tamu", hours: (h, m) => `${h} jam${m ? " " + m + " menit" : ""}`, days: n => `${n} hari`, week: n => `${n}× bersih dalam 7 hari ke depan`, demo: "Contoh: data palsu untuk melihat tampilan." },
  en: { title: "Cleaning schedule", today: "Today", tomorrow: "Tomorrow", inDays: n => `In ${n} days`, ago: n => n === 1 ? "Yesterday" : `${n} days ago`,
    list: "Schedule", cal: "Calendar", all: "All villas",
    turn: "Clean, new guests arrive the same day", out: "Clean after guests leave", in: "Guests arrive: check the villa is ready",
    sameDay: "Same day", leave: "Guests leave", arrive: "New guests arrive", arriveIn: "Guests arrive", next: "Next guests", noNext: "No next guests yet",
    window: "Time to clean", prep: "Get ready for", guests: n => `${n} guest${n === 1 ? "" : "s"}`, adults: n => `${n} adult${n === 1 ? "" : "s"}`, children: n => `${n} child${n === 1 ? "" : "ren"}`, infants: n => `${n} bab${n === 1 ? "y" : "ies"}`, pets: n => `${n} pet${n === 1 ? "" : "s"}`, nights: n => `${n} night${n === 1 ? "" : "s"}`,
    emptySince: "Villa empty since", ready: "Make sure the villa is clean and ready before they arrive",
    notConfirmed: "Not confirmed yet", left: "Guests have left · you can start", inHouse: "Guests still in the villa", fromGuest: "time from the guest",
    sClean: "Clean today", sUrgent: "Clean today · new guests arrive", sGuests: "Guests staying", sArrive: "Guests arrive today", sEmpty: "Villa empty",
    until: "until", nextGuests: "Next guests", noGuests: "No next guests yet", after: "after", before: "before",
    nothing: "Nothing scheduled in the next 3 months.", updated: "Updated", refresh: "Refresh", loading: "Loading the schedule…",
    badlink: "This link doesn't work any more", badlinkP: "Ask IndaVillas for the new link.", nolink: "Open the link from IndaVillas", nolinkP: "This page only opens from the link IndaVillas sent you.",
    neterr: "Couldn't load the schedule", neterrP: "Check your internet, then press Refresh.", stale: "Couldn't refresh. This is the schedule from",
    legGuests: "Guests staying", legClean: "Cleaning day", legSame: "New guests same day", legIn: "Guests arrive", noEvents: "No one leaves or arrives.",
    stay: "Guests staying", hours: (h, m) => `${h} h${m ? " " + m + " min" : ""}`, days: n => `${n} days`, week: n => `${n} clean${n === 1 ? "" : "s"} in the next 7 days`, demo: "Example: made-up data to show how it looks." },
};
const L = () => S.lang === "en" ? "en" : "id", t = k => T[L()][k];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* dates are plain YYYY-MM-DD in Bali time; do the maths in UTC so nothing shifts */
const D = s => new Date(s + "T00:00:00Z"), iso = d => d.toISOString().slice(0, 10);
const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const diff = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const fmt = (s, o) => new Intl.DateTimeFormat(L() === "id" ? "id-ID" : "en-GB", { timeZone: "UTC", ...o }).format(D(s));
const dayLong = s => fmt(s, { weekday: "long", day: "numeric", month: "long" });
const dayShort = s => fmt(s, { weekday: "short", day: "numeric", month: "short" });
const rel = (s, today) => { const n = diff(today, s); return n === 0 ? t("today") : n === 1 ? t("tomorrow") : n > 1 ? t("inDays")(n) : t("ago")(-n); };
const mins = s => { const m = /^(\d{2}):(\d{2})$/.exec(s || ""); return m ? +m[1] * 60 + +m[2] : null; };
const span = (a, b) => { const x = mins(a), y = mins(b); if (x == null || y == null || y <= x) return ""; const m = y - x; return t("hours")(Math.floor(m / 60), m % 60); };
const ICON = {
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 16l-4-4 4-4"/><path d="M5 12h10"/></svg>',
  in: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l4 4-4 4"/><path d="M4 12h10"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
const line = (icon, html, cls = "") => `<div class="ln ${cls}">${ICON[icon]}<span>${html}</span></div>`;
const who = s => {
  if (!s || s.guests == null) return "";
  const parts = ["adults", "children", "infants", "pets"].map(k => s[k] ? t(k)(s[k]) : "").filter(Boolean);
  return `<b>${esc(t("guests")(s.guests))}</b> · ${esc(t("nights")(s.nights))}${parts.length > 1 || s.children || s.infants || s.pets ? ` <em>(${esc(parts.join(", "))})</em>` : ""}`;
};
const timeTxt = (time, guest) => time ? `<b>${esc(time)}</b>${guest ? ` <em>· ${esc(t("fromGuest"))}</em>` : ""}` : "";

/* ---------- the schedule: what happens on which day, per villa ---------- */
function villasShown() { const v = S.data.villas; return S.pid === "all" ? v : v.filter(x => x.id === S.pid); }
function staysOf(pid) { return S.data.stays.filter(s => s.pid === pid).sort((a, b) => a.ci.localeCompare(b.ci)); }
function events(from) {
  const out = [];
  for (const v of villasShown()) {
    const ss = staysOf(v.id);
    for (const s of ss) if (s.co >= from) {
      const next = ss.find(x => x !== s && x.ci >= s.co);
      out.push({ type: next && next.ci === s.co ? "turn" : "out", date: s.co, v, s, next });
    }
    for (const s of ss) if (s.ci >= from && !ss.some(x => x !== s && x.co === s.ci)) {
      const prev = ss.filter(x => x !== s && x.co <= s.ci).pop();
      out.push({ type: "in", date: s.ci, v, s, prev });
    }
  }
  const rank = { turn: 0, out: 1, in: 2 };

function cardHTML(e, today) {
  const multi = S.data.villas.length > 1 && S.pid === "all", d = D(e.date), past = e.date < today;
  const tags = [`<span class="tag rel">${esc(rel(e.date, today))}</span>`];
  if (multi) tags.push(`<span class="tag villa" translate="no">${esc(e.v.title)}</span>`);
  if (e.type === "turn") tags.push(`<span class="tag alert">${esc(t("sameDay"))}</span>`);
  const lines = [];
  if (e.type === "turn" || e.type === "out") {
    if (e.date === today && e.s.left) tags.push(`<span class="tag ok">${esc(t("left"))}</span>`);
    else if (e.date === today && e.s.inHouse) tags.push(`<span class="tag warn">${esc(t("inHouse"))}</span>`);
    lines.push(line("out", `${esc(t("leave"))} ${timeTxt(e.s.out, e.s.outGuest)}`));
    if (e.type === "turn") {
      lines.push(line("in", `${esc(t("arrive"))} ${timeTxt(e.next.in, e.next.inGuest)}`));
      const w = span(e.s.out, e.next.in); if (w) lines.push(line("clock", `${esc(t("window"))}: <b>${esc(w)}</b>`));
      lines.push(line("people", `${esc(t("prep"))} ${who(e.next)}`));

    } else if (e.next) {
      const n = diff(e.date, e.next.ci);
      lines.push(line("next", `${esc(t("next"))}: <b>${esc(dayShort(e.next.ci))}</b> <em>· ${esc(t("days")(n))}</em>`));
      lines.push(line("people", `${esc(t("prep"))} ${who(e.next)}`, "mute"));
    } else lines.push(line("next", esc(t("noNext")), "mute"));
  } else {
    lines.push(line("in", `${esc(t("arriveIn"))} ${timeTxt(e.s.in, e.s.inGuest)}`));
    lines.push(line("people", who(e.s)));
    if (e.prev) lines.push(line("next", `${esc(t("emptySince"))} ${esc(dayShort(e.prev.co))}`, "mute"));
    lines.push(line("check", esc(t("ready")), "mute"));
    if (!e.s.confirmed) tags.push(`<span class="tag warn">${esc(t("notConfirmed"))}</span>`);

    <div class="d" aria-hidden="true"><small>${esc(fmt(e.date, { weekday: "short" }))}</small><b>${d.getUTCDate()}</b><small>${esc(fmt(e.date, { month: "short" }))}</small></div>
    <div><h3>${esc(t(e.type))}</h3><div class="tags">${tags.join("")}</div>${lines.join("")}</div></article>`;
}
function todayHTML(today) {
  return S.data.villas.filter(v => S.pid === "all" || v.id === S.pid).map(v => {
    const ss = staysOf(v.id), out = ss.find(s => s.co === today), inn = ss.find(s => s.ci === today), now = ss.find(s => s.ci < today && s.co > today);
    const nxt = ss.find(s => s.ci > today);
    let cls = "", head = "", sub = "";
    if (out && inn) { cls = "urgent"; head = t("sUrgent") + (inn.in ? " " + inn.in : ""); sub = `${t("leave")} ${out.out || ""} · ${t("prep")} ${inn.guests != null ? t("guests")(inn.guests) : ""}`; }
    else if (out) { cls = "clean"; head = t("sClean") + (out.out ? ` · ${t("after")} ${out.out}` : ""); sub = nxt ? `${t("nextGuests")}: ${dayShort(nxt.ci)}` : t("noGuests"); }
    else if (inn) { cls = "arrive"; head = t("sArrive") + (inn.in ? " " + inn.in : ""); sub = `${inn.guests != null ? t("guests")(inn.guests) + " · " : ""}${t("nights")(inn.nights)}`; }
    else if (now) { cls = "guests"; head = `${t("sGuests")} ${t("until")} ${dayShort(now.co)}`; sub = now.out ? `${t("leave")} ${now.out}` : ""; }
    else { head = t("sEmpty"); sub = nxt ? `${t("nextGuests")}: ${dayShort(nxt.ci)} · ${rel(nxt.ci, today)}` : t("noGuests"); }
    return `<div class="st ${cls}">${S.data.villas.length > 1 ? `<span class="v" translate="no">${esc(v.title)}</span>` : ""}<b>${esc(head)}</b>${sub ? `<p>${esc(sub)}</p>` : ""}</div>`;
  }).join("");
}
function listHTML(today) {
  const ev = events(today);
  if (!ev.length) return `<div class="msg"><p>${esc(t("nothing"))}</p></div>`;
  let mon = "", html = "";
  for (const e of ev) { const m = e.date.slice(0, 7); if (m !== mon) { mon = m; html += `<h2 class="mon">${esc(fmt(e.date, { month: "long", year: "numeric" }))}</h2>`; } html += cardHTML(e, today); }
  return html;
}
function calHTML(today) {
  const v = S.data.villas.find(x => x.id === S.pid) || S.data.villas[0], ss = staysOf(v.id);
  const first = today.slice(0, 7), last = S.data.until.slice(0, 7);
  if (!S.month || S.month < first || S.month > last) S.month = first;
  const m1 = S.month + "-01", lead = (D(m1).getUTCDay() + 6) % 7, start = add(m1, -lead), dim = new Date(Date.UTC(+S.month.slice(0, 4), +S.month.slice(5, 7), 0)).getUTCDate();
  const night = d => ss.find(s => s.ci <= d && s.co > d);
  let cells = "";
  for (let i = 0, n = Math.ceil((lead + dim) / 7) * 7; i < n; i++) {
    const d = add(start, i);
    if (d.slice(0, 7) !== S.month) { cells += `<span class="dy blank" aria-hidden="true"></span>`; continue; }
    const nt = night(d), nb = night(add(d, -1)), co = ss.some(s => s.co === d), ci = ss.some(s => s.ci === d);
    const cls = ["dy", nt && nb && !co ? "occ" : "", ci ? "ci" : "", co ? "co" : "", (nt && nb && !co && !nt.confirmed) ? "uc" : "", d < today ? "past" : "", d === today ? "today" : "", d === S.sel ? "sel" : ""].filter(Boolean).join(" ");
    const label = [dayLong(d), co && ci ? t("legSame") : co ? t("legClean") : ci ? t("legIn") : nt ? t("legGuests") : ""].filter(Boolean).join(" · ");
    cells += `<button type="button" class="${cls}" data-day="${d}" aria-label="${esc(label)}"${d === S.sel ? ' aria-current="date"' : ""}>${+d.slice(8)}${co || ci ? '<i class="mk"></i>' : ""}</button>`;
  }
  const wd = [...Array(7)].map((_, i) => `<span class="wd">${esc(fmt(add("2024-01-01", i), { weekday: "short" }).replace(".", ""))}</span>`).join("");
  const sel = S.sel || today, evs = events(add(sel, 0)).filter(e => e.date === sel && e.v.id === v.id), stay = night(sel);
  const info = evs.length ? evs.map(e => cardHTML(e, today)).join("") : `<p class="none">${esc(dayLong(sel))}: ${esc(stay ? `${t("stay")} · ${t("leave")} ${dayShort(stay.co)}` : t("noEvents"))}</p>`;
  return `${S.data.villas.length > 1 ? chipsHTML(false) : ""}
    <div class="cal"><div class="cnav"><button type="button" data-mon="-1" aria-label="‹" ${S.month <= first ? "disabled" : ""}>‹</button><b>${esc(fmt(m1, { month: "long", year: "numeric" }))}</b><button type="button" data-mon="1" aria-label="›" ${S.month >= last ? "disabled" : ""}>›</button></div>
    <div class="grid">${wd}${cells}</div>
    <div class="legend"><span><i></i>${esc(t("legGuests"))}</span><span><i class="dot"></i>${esc(t("legClean"))}</span><span><i class="dot r"></i>${esc(t("legSame"))}</span><span><i class="dot g"></i>${esc(t("legIn"))}</span></div></div>
    <div class="dayinfo">${info}</div>`;
}
function chipsHTML(withAll) {

/* ---------- page ---------- */
function render() {
  document.documentElement.lang = L();
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === L())));
  document.title = `${t("title")} · IndaVillas`;
  const app = document.getElementById("app");
  if (!KEY && !DEMO) { app.innerHTML = `<div class="msg"><b>${esc(t("nolink"))}</b><p>${esc(t("nolinkP"))}</p></div>`; return; }
  if (!S.data) {
    app.innerHTML = S.loading ? `<div class="head"><p class="eyebrow">${esc(t("title"))}</p></div><p class="date">${esc(t("loading"))}</p><div class="sk"></div><div class="sk"></div><div class="sk"></div>`
      : `<div class="msg"><b>${esc(S.err === "gone" ? t("badlink") : t("neterr"))}</b><p>${esc(S.err === "gone" ? t("badlinkP") : t("neterrP"))}</p></div>${S.err === "gone" ? "" : `<div class="foot"><span></span><button type="button" class="btn pri" data-refresh>${esc(t("refresh"))}</button></div>`}`;

    ${DEMO ? `<p class="note">${esc(t("demo"))}</p>` : ""}${S.stale ? `<p class="note">${esc(t("stale"))} ${esc(upd.toLocaleString(L() === "id" ? "id-ID" : "en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" }))}.</p>` : ""}
    <section class="today" aria-label="${esc(t("today"))}">${todayHTML(today)}</section>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="list" aria-selected="${S.tab === "list"}">${esc(t("list"))}</button><button type="button" role="tab" data-tab="cal" aria-selected="${S.tab === "cal"}">${esc(t("cal"))}</button></div>
    ${S.tab === "list" ? `${single ? "" : chipsHTML(true)}${listHTML(today)}` : calHTML(today)}
    <div class="foot"><span>${esc(t("updated"))} ${esc(upd.toLocaleTimeString(L() === "id" ? "id-ID" : "en-GB", { hour: "2-digit", minute: "2-digit" }))}</span><button type="button" class="btn" data-refresh ${S.busy ? "disabled" : ""}>${esc(t("refresh"))}</button></div>`;
}

async function load() {
  if (S.busy) return; S.busy = true; render();
  try {
    let data;
    if (DEMO) data = demoData();
    else {
      const r = await fetch(API + "?k=" + encodeURIComponent(KEY), { cache: "no-store", referrerPolicy: "no-referrer" });
      if (r.status === 404) { S.err = "gone"; S.data = null; S.loading = false; store.del("iv_clean_" + KEY); return; }
      if (!r.ok) throw new Error("http " + r.status);
      data = await r.json();
    }
    S.data = data; S.err = ""; S.stale = false; S.loading = false;
    if (!S.lang) S.lang = data.lang;
    if (!DEMO) store.set("iv_clean_" + KEY, JSON.stringify(data));
  } catch (e) {
    const old = !DEMO && store.get("iv_clean_" + KEY);
    if (!S.data && old) { try { S.data = JSON.parse(old); } catch (x) {} }
    S.stale = !!S.data; S.err = "net"; S.loading = false;
  } finally { S.busy = false; render(); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lang) { S.lang = b.dataset.lang; store.set("iv_clean_lang", S.lang); render(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); return; }
  if (b.dataset.pid) { S.pid = b.dataset.pid === "all" ? "all" : +b.dataset.pid; S.sel = null; render(); return; }
  if (b.dataset.mon) { const [y, m] = S.month.split("-").map(Number), d = new Date(Date.UTC(y, m - 1 + +b.dataset.mon, 1)); S.month = iso(d).slice(0, 7); render(); return; }
  if (b.dataset.day) { S.sel = b.dataset.day; render(); document.querySelector(".dayinfo")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
  if (b.hasAttribute("data-refresh")) load();
});
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (Date.now() - hiddenAt > 120000) load(); });
setInterval(() => { if (!document.hidden) load(); }, 600000);
