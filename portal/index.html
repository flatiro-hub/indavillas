  const r = xbox("bots").x, b = r && (r.bots || []).find(x => x.id === el.dataset.id);
  const refresh = () => { xdrop("bots", "x"); render(); };
  if (kind === "botcopy") { copyText(el.dataset.v, el.dataset.for ? document.getElementById(el.dataset.for) : el.previousElementSibling); return; }
  if (kind === "botedit") {
    if (!r) return;
    const isNew = !b, cur = b || { name: "", allVillas: true, propertyIds: [], perms: r.defaults || {}, write: false };
    const box = (id, label, on, sub) => `<label class="check"><input type="checkbox" data-k="${esc(id)}" ${on ? "checked" : ""}><span>${label}${sub ? `<small class="muted" style="display:block">${sub}</small>` : ""}</span></label>`;
    openSheet({ title: isNew ? "Add a bot" : "Edit " + b.name, wide: true, okLabel: isNew ? "Create key" : "Save",
      sub: isNew ? "You get the key once, right after this." : "Changes apply to the bot's next call. The key stays the same.",
      body: `<div class="fgrid"><div class="fx full"><label for="bt_n">Name</label><input class="ctl" id="bt_n" value="${esc(cur.name)}" placeholder="e.g. Grok" autocomplete="off"></div></div>
        <fieldset class="mgset" id="bt_v"><legend>Villas</legend><label class="check"><input type="checkbox" id="bt_all" ${cur.allVillas ? "checked" : ""}><span>All villas, including ones added later</span></label>
          <div id="bt_vl" ${cur.allVillas ? "hidden" : ""}>${(r.villas || []).map(v => box("v" + v.id, esc(v.title), (cur.propertyIds || []).includes(v.id))).join("") || `<p class="hint">No villas in Hostex.</p>`}</div></fieldset>
        <fieldset class="mgset" id="bt_k"><legend>What it can see</legend>${Object.entries(r.perms || {}).map(([k, l]) => box("p" + k, esc(l), !!cur.perms?.[k])).join("")}</fieldset>
        <fieldset class="mgset"><legend>Changes</legend><label class="check"><input type="checkbox" id="bt_w" ${cur.write ? "checked" : ""}><span>Can make changes<small class="muted" style="display:block">Block and open dates, prices and minimum stay, tasks and guest messages, within what it can see. It always shows the change first and needs your OK.</small></span></label></fieldset>`,
      ok: async bx => {
        const q = s => bx.querySelector(s), allVillas = q("#bt_all").checked, propertyIds = [...bx.querySelectorAll("#bt_vl input:checked")].map(i => +i.dataset.k.slice(1)), perms = {};
        bx.querySelectorAll("#bt_k input").forEach(i => (perms[i.dataset.k.slice(1)] = i.checked));
        if (!allVillas && !propertyIds.length) throw { message: "Tick at least one villa, or All villas." };
        const out = await api("bots.save", { bot: { id: b?.id, name: q("#bt_n").value.trim(), allVillas, propertyIds, perms, write: q("#bt_w").checked, active: b ? b.active : true } });
        refresh();
        if (out.key) setTimeout(() => botKeySheet(out.bot, out.key), 0); else toast("Saved");
      } });
    const sh = document.querySelector(".sheet.xs"); sh?.querySelector("#bt_all")?.addEventListener("change", e => { sh.querySelector("#bt_vl").hidden = e.target.checked; });
    return;
  }
  if (!b) return;
  if (kind === "botkey") { confirmSheet(`Renew the key for ${b.name}?`, "The current key stops working at once. You'll need to paste the new one into the bot.", "Renew key", async () => { try { const out = await api("bots.rotate", { id: b.id }); refresh(); botKeySheet(out.bot, out.key); } catch (e) { toast(errText(e)); } }); return; }
  if (kind === "botoff") { try { await api("bots.save", { bot: { ...b, active: b.active === false } }); toast(b.active === false ? "Switched on" : "Switched off. Its key stops working until you switch it on."); refresh(); } catch (e) { toast(errText(e)); } return; }
  if (kind === "botdel") { confirmSheet(`Delete ${b.name}?`, "Its key stops working for good. What it changed stays as it is.", "Delete", async () => { try { await api("bots.remove", { id: b.id }); toast("Deleted"); refresh(); } catch (e) { toast(errText(e)); } }); }
}
["botedit", "botkey", "botoff", "botdel", "botcopy"].forEach(k => (ACT[k] = el => botsAction(k, el)));

["stgen", "stview", "stcom", "stpub", "stunpub", "bladd", "bldel", "baadd", "badel", "bogen"].forEach(k => (ACT[k] = el => billingAction(k, el)));

document.addEventListener("click", e => {
  const an = e.target.closest("[data-anav]"); if (an) { goAdmin(an.dataset.anav); return; }
  const mn = e.target.closest("[data-mnav]"); if (mn) { goMgr(mn.dataset.mnav); return; }
  const x = e.target.closest("[data-x]"); if (!x || !x.dataset.x || !ACT[x.dataset.x]) return;
  if (x.closest(".pview") && !["print", "pclose"].includes(x.dataset.x)) return;
  ACT[x.dataset.x](x);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".pview")) { closePrint(); return; }
  if (e.target.id === "ib_txt" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ibSend(S.ib.id, $("[data-x=ibsend]")); return; }
  const r = e.target.closest && e.target.closest(".rowlink"); if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); r.click(); }
});
document.addEventListener("submit", e => {
  const f = e.target; if (!f.id || !f.id.startsWith("x_")) return; e.preventDefault();
  if (f.id === "x_apform") return apCreate(f);
  if (f.id === "x_rvcustom") return customSubmit(f);
  if (["x_bset", "x_bplan", "x_binv"].includes(f.id)) return billingSubmit(f);
});
// keep what people type when the page re-renders
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ib_txt" && S.ib.id) (S.ib.drafts ||= {})[S.ib.id] = t.value;
  else if (t.id === "mb_q") { S.mg.q = t.value; const l = $("#mb_list"), h = mhome(); if (l && h) l.innerHTML = mbList(h); }
  else if (t.id === "ib_q") { S.ib.q = t.value; const l = $("#ib_list"); if (l) l.innerHTML = ibListHTML(xbox("ibl").x || []); }
  else if (t.dataset && t.dataset.rk) xbox("rvd")[t.dataset.rk] = t.value;
  else if (t.dataset && t.dataset.sk) (S.stc ||= {})[t.dataset.sk] = t.value;
  else if (t.closest && t.closest("#bi_lines")) { const f = t.closest("form"), email = f && f.dataset.email; if (email) { const l = readLines(email), tot = $("#bi_total"); if (tot) tot.textContent = "Total " + money2(l.reduce((s0, x) => s0 + (+x.qty || 0) * (+String(x.unit).replace(/[, ]/g, "") || 0), 0), $("#bi_cur")?.value || "USD"); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.xc === "opsel") { S.opsel[t.dataset.k] = t.checked; const y = scrollY; render(); window.scrollTo(0, y); }
  else if (t.dataset && t.dataset.xc === "mcv") { S.mg.pid = +t.value; S.mg.sel = null; render(); }
  else if (t.dataset && t.dataset.xc === "mbv") { S.mg.vf = t.value; render(); }
});


/* ---------- Boot ---------- */
bootStore();
</script>
